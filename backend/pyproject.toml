[project]
name = "apache-status-monitor"
version = "0.1.0"
description = "Secure multi-server monitoring foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.18,<2",
  "pydantic-settings>=2.13,<3",
  "argon2-cffi>=25.1,<26",
  "pyotp>=2.9,<3",
  "pyjwt[crypto]>=2.12,<3",
  "cryptography>=50,<51",
  "apscheduler>=3.11,<4",
  "segno>=1.6.6,<2",
  "dnspython>=2.8,<3",
  "maxminddb>=2.8,<4",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.15,<1", "pip-audit>=2.10,<3"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
